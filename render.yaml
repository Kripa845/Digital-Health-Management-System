# Render Blueprint for the backend API (see docs/deployment.md).
# Render → New → Blueprint → pick this repo. Values marked sync: false are asked for once.
services:
  - type: web
    name: merocarecard-api
    runtime: docker
    plan: free
    region: virginia   # same region as the Neon database (us-east-1); cannot be changed later
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # Free plan has 512 MB: one worker (one copy of the symptom model), threads for concurrency.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      - key: DATABASE_URL          # Neon connection string
        sync: false
      - key: CORS_ALLOWED_ORIGINS  # https://<project>.vercel.app
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: LAB_REPORT_ENCRYPTION_KEY  # Fernet key; keep a copy, never change it
        sync: false
      - key: DJANGO_ADMIN_USERNAME
        sync: false
      - key: DJANGO_ADMIN_EMAIL
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
