<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f7a6b" />
    <meta name="description" content="Mero Care Card — a secure digital health platform. Carry your essential medical identity on a scannable QR card, find the right doctor, and keep your records private." />
    <title>Mero Care Card — Your health, gently in hand</title>
    <script>
      // Apply saved/system theme before paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('mcc-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
